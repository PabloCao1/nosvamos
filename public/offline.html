<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#25272C" />
    <title>NosVamos — Sin conexión</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #25272c; color: #f5f8f6; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { max-width: 360px; text-align: center; }
      .mark { width: 64px; height: 64px; margin: 0 auto 20px; display: grid; place-items: center; border-radius: 22px; background: #b8f7e4; font-size: 28px; }
      h1 { margin: 0 0 8px; font-size: 28px; letter-spacing: -.03em; }
      p { margin: 0; color: #aeb5b2; }
      button { margin-top: 24px; min-height: 48px; padding: 0 20px; border: 0; border-radius: 16px; background: #b8f7e4; color: #25272c; font: inherit; font-weight: 700; }
    </style>
  </head>
  <body>
    <main>
      <img class="mark" src="icons/pwa-192x192.png" alt="" />
      <h1>Estás sin conexión</h1>
      <p>Los viajes descargados siguen disponibles. Volvé a intentar cuando recuperes señal.</p>
      <button onclick="location.reload()">Reintentar</button>
    </main>
  </body>
</html>
